app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:62937,http://127.0.0.1:62937}
server:
  port: 8080
spring:
  datasource:
    url: jdbc:oracle:thin:@//localhost:1522/freepdb1
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

    properties:
      hibernate:
        format_sql: true

    database-platform: org.hibernate.dialect.OracleDialect
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    enabled: true

